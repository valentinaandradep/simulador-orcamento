<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora TechStore</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <main class="container">
        <h1>Simulador de Orçamento - TechStore</h1>

        <form id="form-orcamento">
            <div class="form-group">
                <label for="valor-produto">Valor do Produto (R$):</label>
                <input type="number" id="valor-produto" step="0.01" min="0.01" required placeholder="Ex: 100.00">
            </div>

            <div class="form-group">
                <label for="forma-pagamento">Forma de Pagamento:</label>
                <select id="forma-pagamento" required>
                    <option value="">Selecione...</option>
                    <option value="pix">PIX (15%)</option>
                    <option value="boleto">Boleto (10%)</option>
                    <option value="cartao-vista">Cartão à Vista (5%)</option>
                    <option value="cartao-parcelado">Cartão Parcelado (0%)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tipo-entrega">Modalidade de Frete:</label>
                <select id="tipo-entrega" required>
                    <option value="">Selecione...</option>
                    <option value="retirada">Retirada (R$ 0,00)</option>
                    <option value="padrao">Entrega Padrão (R$ 12,00)</option>
                    <option value="expressa">Expressa (R$ 25,00)</option>
                    <option value="super-expressa">Super Expressa (R$ 45,00)</option>
                </select>
            </div>

            <button type="submit" id="btn-calcular">Calcular Orçamento</button>
        </form>

        <div id="painel-resultado" class="hidden">
            <h2>Resultado do Orçamento</h2>
            <p><strong>Valor do Produto:</strong> <span id="res-produto">R$ 0,00</span></p>
            <p><strong>Desconto Aplicado:</strong> <span id="res-desconto">R$ 0,00</span></p>
            <p><strong>Valor do Frete:</strong> <span id="res-frete">R$ 0,00</span></p>
            <p class="total-final"><strong>Total Final:</strong> <span id="res-total">R$ 0,00</span></p>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
